<header class="app-header">
  <div class="header-left">
    <h1>
      <a routerLink="/" class="title-link">
        {{ uiTranslationService.getText('game.title') }}
      </a>
    </h1>
    <nav class="header-nav">
      <a 
        routerLink="/" 
        routerLinkActive="active"
        [routerLinkActiveOptions]="{exact: true}"
        class="nav-link">
        {{ uiTranslationService.getText('nav.today') }}
      </a>
      <a 
        routerLink="/archive" 
        routerLinkActive="active"
        class="nav-link">
        {{ uiTranslationService.getText('nav.archive') }}
      </a>
    </nav>
  </div>
  
  <button 
    (click)="localizationService.toggleLanguage()" 
    class="language-toggle"
    type="button"
    [attr.aria-label]="'Toggle language'">
    {{ uiTranslationService.getLanguageDisplayName(localizationService.getLanguage()) }}
  </button>
</header>
